name: hygiene-check

# 终门：push / PR 必跑。
#
# ⚠️ 配 `main` 分支保护后这道门才真能拦住 ——
#    否则（直推 main 模式）CI 是在 push **之后**才跑，红叉只等于"记了一笔"。
#    这是本项目同类仓库踩过的坑：**滞后门**。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  hygiene-check:
    name: hygiene-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ⚠️ `--no-private-list` 是**显式声明**：
      #    tools/private-names.txt 被 .gitignore 排除、不进仓库 ⇒ CI 上它必然不存在。
      #    **不传这个开关，脚本会直接报错** —— 因为"清单缺失时静默跳过"
      #    正是本项目要防的形状（该有输入的地方没输入，却照常打绿）。
      #    传了它 = 承认第 6 项本次为空、并在输出里**声明**这一点。
      - name: 公开卫生校验（绝对路径 / 家目录 / 邮箱 / 密钥 / 手机号）
        run: python3 tools/check_public_hygiene.py --no-private-list

      # 门禁自己也要有防腐：证明这些检查**在违规时真的会变红**（突变验证）
      - name: 检查器自检（突变验证）
        run: python3 tools/check_public_hygiene.py --self-test
